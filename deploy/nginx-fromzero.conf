# /etc/nginx/sites-available/fromzero
# certbot --nginx adds the 443/SSL block and the http->https redirect automatically.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name fromzero.ro www.fromzero.ro _;   # "_" = also answers on the bare IP

    root /opt/fromzero/app/dist;
    index index.html;

    # booking form API (Node, localhost only)
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 32k;
    }

    # hashed build assets: cache for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
